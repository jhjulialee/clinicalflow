services:
  - type: web
    name: clinicalflow-api
    env: python
    buildCommand: pip install -r requirements.txt
    startCommand: gunicorn --chdir server wsgi:app
    envVars:
      - key: DATABASE_URL
        fromDatabase:
          name: clinicalflow-db
          property: connectionString
      - key: SECRET_KEY
        generateValue: true
      - key: CORS_ORIGIN
        sync: false

databases:
  - name: clinicalflow-db
    databaseName: clinicalflow
    user: clinicalflow
